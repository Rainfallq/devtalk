{% extends "base.html" %}
{% block title %}Register - DevTalk{% endblock %}
{% block content %}
<div style="max-width:400px;margin:40px auto;">
  <h1>Create an account</h1>
  <div style="background:#fff;border:1px solid #ddd;border-radius:4px;padding:24px;margin-top:16px;">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/register">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" maxlength="50" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn" style="width:100%;">Register</button>
    </form>
    <p style="margin-top:14px;font-size:13px;color:#666;text-align:center;">Already have an account? <a href="/login">Log in</a></p>
  </div>
</div>
{% endblock %}
